<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обновления Делоскопа — что нового и что проверить</title>
<meta name="description" content="Лента обновлений Делоскопа: что изменилось на сайте и что стоит проверить.">
<link rel="canonical" href="https://deloskop.ru/obnovleniya/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F2;--card:#FFFFFF;--ink:#1D1D1F;--ink2:#48484C;--muted:#6B6B70;--line:#E6E6E1;--accent:#0B63E5;--ok:#16723F;--pad:clamp(16px,6.5vw,96px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{padding:20px var(--pad);display:flex;justify-content:space-between;align-items:center}
header .logo{font-weight:600;font-size:20px;color:var(--ink)}
main{max-width:860px;margin:0 auto;padding:24px var(--pad) 96px}
h1{font-size:clamp(34px,6vw,56px);line-height:1.05;letter-spacing:-.025em;margin:24px 0 12px;font-weight:600}
.lead{font-size:clamp(18px,2.4vw,22px);color:var(--ink2);margin:0 0 40px;line-height:1.4}
.u{background:var(--card);border-radius:28px;padding:clamp(22px,4vw,40px);margin-bottom:20px}
.tag{display:inline-block;font-size:14px;font-weight:600;color:var(--accent);background:#EAF1FD;border-radius:999px;padding:6px 14px;margin-bottom:12px}
.u h2{font-size:clamp(24px,4vw,32px);margin:0 0 16px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.u h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.u ul{list-style:none;margin:0;padding:0}
.u li{font-size:clamp(17px,2.2vw,19px);line-height:1.4;padding:8px 0 8px 28px;position:relative;border-bottom:1px solid var(--line)}
.u li:last-child{border-bottom:0}
.n li:before{content:'';position:absolute;left:4px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.p li:before{content:'✓';position:absolute;left:2px;top:7px;color:var(--ok);font-weight:600}
.note{color:var(--ink2);font-size:16px;margin:18px 0 0;line-height:1.45}
.empty{color:var(--muted)}
</style>
</head>
<body>
<header><a class="logo" href="/">Делоскоп</a><a href="/">На главную</a></header>
<main>
<h1>Обновления</h1>
<p class="lead">Что изменилось на сайте и что стоит проверить. Новое — сверху.</p>
<div id="list"><p class="empty">Загружаю…</p></div>
</main>
<script>
(function(){
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  var box=document.getElementById("list");
  fetch("/obnovleniya.json",{cache:"no-cache"}).then(function(r){return r.json();}).then(function(d){
    var list=(d&&d.obnovleniya)||[];
    if(!list.length){box.innerHTML='<p class="empty">Пока обновлений нет.</p>';return;}
    box.innerHTML=list.map(function(u){
      var h='<section class="u" id="'+esc(u.id)+'"><span class="tag">'+esc(u.data)+'</span><h2>'+esc(u.zagolovok)+'</h2>';
      if(u.chto_novogo&&u.chto_novogo.length)h+='<h3>Что нового</h3><ul class="n">'+u.chto_novogo.map(function(t){return'<li>'+esc(t)+'</li>';}).join('')+'</ul>';
      if(u.chto_proverit&&u.chto_proverit.length)h+='<h3>Что проверить</h3><ul class="p">'+u.chto_proverit.map(function(p){return'<li>'+(p.ssylka?'<a href="'+esc(p.ssylka)+'">'+esc(p.tekst)+' →</a>':esc(p.tekst))+'</li>';}).join('')+'</ul>';
      if(u.kuda_pisat)h+='<p class="note">'+esc(u.kuda_pisat)+'</p>';
      return h+'</section>';
    }).join('');
  }).catch(function(){box.innerHTML='<p class="empty">Не удалось загрузить список. Обновите страницу.</p>';});
})();
</script>
</body>
</html>
