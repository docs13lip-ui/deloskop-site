# hsts-v1 ([Ночные запуски] 14.11.2026): общие защитные заголовки — один файл на все ответы сайта.
# Зачем файлом: в nginx add_header из server НЕ наследуется в location, где есть свои add_header,
# поэтому каждый location с Cache-Control / X-Robots-Tag подключает этот файл сам (include) — правило не разойдётся.
# В образе лежит как /etc/nginx/deloskop/zagolovki.conf (Dockerfile). Сторож — tests/nginx.test.js.
#
# HSTS: браузер год ходит на сайт только по https. Без includeSubDomains и preload — поддомены не сверены
# (решение Штаба 14.11). TLS снимает Timeweb до нас, поэтому заголовок ставим всегда (always — и на 301, 404).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
