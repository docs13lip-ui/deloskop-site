# Делоскоп — сервер сайта deloskop.ru (nastoyashij-404-v2, [Ночные запуски] 01.10.2026).
# Зачем: тип приложения «HTML/CSS/JS» в Timeweb отдаёт index.html с кодом 200 на ЛЮБОЙ адрес (мягкая 404),
# даже с выключенным SPA Fallback. Здесь сервер наш: несуществующий адрес → /404.html с кодом 404.
# Кладётся в образ как /etc/nginx/conf.d/default.conf (см. Dockerfile). Проверка — tests/nginx.test.js.
# TLS снимает Timeweb перед контейнером, поэтому слушаем 80 и не пишем схему/порт в редиректы.

# www-301-v1 (14.11.2026): с 13.11 ~22:38 www.deloskop.ru отдавал сайт без перехода — для Яндекса это второе зеркало
# (дубли всех страниц; canonical лишь подсказка). Балансировщик Timeweb передаёт имя домена как есть (Host),
# поэтому www ловим отдельным сервером и ведём одним 301 на основной адрес с тем же путём и параметрами.
# Схема здесь пишется явно: TLS снят до нас, а absolute_redirect off относится только к основному серверу.
server {
    listen 80;
    server_name www.deloskop.ru;
    server_tokens off;
    include /etc/nginx/deloskop/zagolovki.conf;
    return 301 https://deloskop.ru$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain text/xml application/xml image/svg+xml;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    # szhatie-proxied-v1 (13.11.2026): TLS снимает балансировщик Timeweb, запрос приходит к нам как проксированный
    # (HTTP/1.0 или с заголовком Via). По умолчанию nginx такие ответы не сжимает (gzip_proxied off, gzip_http_version 1.1) —
    # на живом главная шла 124 КБ вместо 36. gzip_static подчиняется тем же двум директивам.
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json text/plain text/xml application/xml image/svg+xml;

    # hsts-v1 (14.11.2026): HSTS, nosniff, Referrer-Policy — из одного файла (deploy/zagolovki.conf). Здесь — для ответов
    # без своих add_header (return 301/302/404); каждый location со своими add_header подключает файл сам.
    include /etc/nginx/deloskop/zagolovki.conf;

    # Настоящая 404: своя страница, код 404, адрес в строке браузера не меняется.
    error_page 404 /404.html;

    # Страницы, стили, скрипты, данные — без версий в адресах, поэтому браузер переспрашивает (ETag → 304).
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/deloskop/zagolovki.conf;
    }

    # vizual-v3.0b: сжатые копии (.gz) кладёт Dockerfile при сборке образа — отдаём их без сжатия на лету
    # (уровень 9 вместо 5, процессор не тратится); у файла без копии — сжатие на лету, как раньше.
    gzip_static on;

    # vizual-v3.0b: пакеты с отпечатком в имени (tests/sobrat_js.py) — новое содержимое = новое имя файла,
    # поэтому браузер хранит их год и не переспрашивает; HTML ссылается на новый отпечаток сразу (no-cache).
    location ~ "^/(?:js|css)/b/[a-z0-9-]+\.[0-9a-f]{10}\.(?:js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/deloskop/zagolovki.conf;
    }

    # Шрифты и картинки меняются редко.
    location ~* \.(?:woff2?|ttf|otf|png|jpe?g|webp|avif|gif|ico|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/deloskop/zagolovki.conf;
    }

    # pwa-v1 (12.10): манифест приложения — с правильным типом; sw.js идёт через «location /» (no-cache — обновляется сразу).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/deloskop/zagolovki.conf;
    }

    location = /404.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/deloskop/zagolovki.conf;
    }

    # Короткие адреса, которые раньше ловил скрипт мягкой 404 в index.html.
    location = /cabinet { return 301 /cabinet.html$is_args$args; }
    location = /report  { return 301 /report.html$is_args$args; }
    location = /admin   { return 301 /admin.html$is_args$args; }
    location = /cabinet/ { return 301 /cabinet.html$is_args$args; }
    location = /report/  { return 301 /report.html$is_args$args; }
    location = /admin/   { return 301 /admin.html$is_args$args; }

    # vizual-v3.1a: адрес отчёта /otchet/<ИНН>/ — главная (она сама проверяет ИНН из адреса), без индексации:
    # отчёт на дату — не страница для поиска (для поиска — карточки /company/). Другие адреса под /otchet/ — 404.
    # Ссылки на этот адрес сайт начнёт давать после переезда (флаг OTCHET_PUT в index.html).
    location ~ "^/otchet/([0-9]{10}|[0-9]{12})$" { return 301 /otchet/$1/$is_args$args; }
    location ~ "^/otchet/(?:[0-9]{10}|[0-9]{12})/$" {
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/deloskop/zagolovki.conf;
    }

    # Карточки компаний: есть страница — отдаём; нет — ведём на проверку по ИНН (как скрипт 404.html).
    location /company/ {
        try_files $uri $uri/ @company;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/deloskop/zagolovki.conf;
    }
    location @company {
        if ($uri ~ "^/company/(\d{10})(?:[-/]|$)") {
            return 302 /?inn=$1;
        }
        return 404;
    }

    # Служебное наружу не отдаём (в образ оно и так не попадает — .dockerignore; это вторая защита).
    location ~ /\.(?!well-known/) { return 404; }
    location ~* ^/(?:tests|deploy|\.github)/ { return 404; }
    location ~* \.(?:py|pyc|md|patch|jsonl|sh|yml|yaml|conf)$ { return 404; }
}
